services:
  postgres:
    image: postgres:16-alpine
    container_name: mapviz-postgres
    environment:
      POSTGRES_DB: mapviz
      POSTGRES_USER: mapviz
      POSTGRES_PASSWORD: mapviz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapviz -d mapviz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
